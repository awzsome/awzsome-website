<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Awzsome Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --blue:    #E85D35;
  --blue-dk: #C4421C;
  --blue-lt: #FFF7ED;
  --ink:     #1C1917;
  --ink2:    #44403C;
  --ink3:    #78716C;
  --surface: #FAFAF9;
  --border:  #E7E5E4;
  --white:   #FFFFFF;
  --font:    'Plus Jakarta Sans', sans-serif;
  --r:       12px;
  --rxl:     28px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--surface);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}

nav{background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;padding:0 max(5vw,24px)}
.nav-logo{text-decoration:none;display:flex;align-items:center;line-height:1}

.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rxl);padding:2.75rem 2.5rem;max-width:400px;width:100%;text-align:center}
.card h1{font-size:1.625rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.5rem;color:var(--ink)}
.card p{font-size:1rem;color:var(--ink2);margin-bottom:2rem;line-height:1.6}
.gbtn-slot{display:flex;justify-content:center;margin-bottom:1.25rem}
.status{font-size:.9375rem;color:var(--ink2);min-height:1.5rem}
.status.err{color:var(--blue-dk);font-weight:600}

.dash{display:none;max-width:400px;width:100%;text-align:center}
.dash.show{display:block}
.dash .who{font-size:1.0625rem;font-weight:700;color:var(--ink);margin-bottom:.25rem}
.dash .role{display:inline-block;background:var(--blue-lt);color:var(--blue-dk);font-size:.8125rem;font-weight:700;padding:.25rem .75rem;border-radius:100px;margin-bottom:1.5rem}
.dash .note{font-size:.9375rem;color:var(--ink3);margin-bottom:1.5rem;line-height:1.6}
.signout{display:inline-block;color:var(--ink2);font-size:.9375rem;font-weight:600;text-decoration:none;border:1.5px solid var(--border);border-radius:var(--r);padding:.5rem 1.25rem;transition:border-color .15s,color .15s}
.signout:hover{border-color:var(--blue);color:var(--blue)}
</style>
<canvas id="logo-m" style="display:none;position:absolute;top:-9999px"></canvas>
</head>
<body>

<nav>
  <a href="/" class="nav-logo" id="nav-logo-link" style="display:flex;align-items:center;text-decoration:none"><div id="nav-logo-slot"></div></a>
</nav>

<div class="wrap">
  <div class="card" id="signin-card">
    <h1>Admin sign-in</h1>
    <p>Sign in with your authorized Google account to access the Awzsome dashboard.</p>
    <div class="gbtn-slot" id="gbtn-slot"></div>
    <div class="status" id="status"></div>
  </div>

  <div class="dash" id="dash-card">
    <div class="card">
      <div class="who" id="who-email"></div>
      <div class="role" id="who-role"></div>
      <p class="note">Signed in successfully. The full dashboard (stats, vendor approvals, and reports) is coming in the next phase — this confirms your login is working end to end.</p>
      <a href="#" class="signout" id="signout-link">Sign out</a>
    </div>
  </div>
</div>

<!-- Same wordmark logo generator as awzsome.com, for visual consistency -->
<script>
(function(){
  const NS  = 'http://www.w3.org/2000/svg';
  const cvs = document.getElementById('logo-m');
  const ctx = cvs.getContext('2d');

  document.fonts.load("800 100px 'Plus Jakarta Sans'").then(function(){

    function makeLogo(fontSize, inkColor, smileColor) {
      ctx.font = '800 ' + fontSize + 'px "Plus Jakarta Sans"';
      const mFull  = ctx.measureText('Awzsome');
      const mA     = ctx.measureText('A');
      const cap    = mA.actualBoundingBoxAscent  || fontSize*0.72;
      const desc   = mA.actualBoundingBoxDescent || fontSize*0.12;
      const aLeft  = mA.actualBoundingBoxLeft  !==undefined ? -mA.actualBoundingBoxLeft  : 0;
      const aRight = mA.actualBoundingBoxRight !==undefined ?  mA.actualBoundingBoxRight : mA.width;

      const sw     = fontSize * 0.134;
      const apexX  = (aLeft + aRight) / 2;
      const apexY  = 0;
      const baseY  = cap;

      const lBotX  = apexX + (aLeft  - apexX) * 0.72;
      const rBotX  = apexX + (aRight - apexX) * 0.72;

      const tFrac  = 0.64;
      const crossY = apexY + (baseY - apexY) * tFrac;
      const lEdgeX = apexX + tFrac*(lBotX - apexX);
      const rEdgeX = apexX + tFrac*(rBotX - apexX);
      const ext    = sw * 1.5;
      const lx     = lEdgeX - ext;
      const rx     = rEdgeX + ext;
      const dip    = (baseY - apexY) * 0.26;
      const arcSW  = sw * 0.50;
      const tLen   = sw * 0.82;

      const lDX=lBotX-apexX, lDY=baseY-apexY, lL=Math.hypot(lDX,lDY);
      const lUX=lDX/lL, lUY=lDY/lL;
      const rDX=rBotX-apexX, rDY=baseY-apexY, rL=Math.hypot(rDX,rDY);
      const rUX=rDX/rL, rUY=rDY/rL;

      const leftmostX  = Math.min(lx + lUX*tLen, lx - lUX*tLen, lx);
      const bottommostY = Math.max(crossY+dip, crossY+lUY*tLen, crossY+rUY*tLen, baseY);
      const padL   = Math.ceil(Math.max(0, -leftmostX) + sw*0.6);
      const padTop = Math.ceil(sw * 0.6);
      const padBot = Math.ceil(Math.max(0, bottommostY - cap) + sw*0.6 + desc);
      const totalW = Math.ceil(mFull.width + padL + sw*0.6);
      const totalH = Math.ceil(cap + padTop + padBot);
      const bl     = padTop + cap + fontSize*0.02;
      const ox = padL, oy = padTop;

      const s = document.createElementNS(NS,'svg');
      s.setAttribute('width',totalW); s.setAttribute('height',totalH);
      s.setAttribute('viewBox','0 0 '+totalW+' '+totalH);

      const txt = document.createElementNS(NS,'text');
      txt.setAttribute('x',ox.toFixed(1)); txt.setAttribute('y',bl.toFixed(1));
      txt.setAttribute('font-size',fontSize); txt.setAttribute('font-weight','800');
      txt.setAttribute('font-family',"'Plus Jakarta Sans',sans-serif");
      txt.setAttribute('letter-spacing','-0.01em');
      const spA = document.createElementNS(NS,'tspan');
      spA.setAttribute('fill','transparent'); spA.textContent='A';
      const spW = document.createElementNS(NS,'tspan');
      spW.setAttribute('fill',inkColor);
      spW.setAttribute('dx',(fontSize*0.02).toFixed(1));
      spW.textContent='wzsome';
      txt.appendChild(spA); txt.appendChild(spW); s.appendChild(txt);

      const AX=apexX+ox, AY=apexY+oy;
      const LBX=lBotX+ox, RBX=rBotX+ox, BY=baseY+oy;
      const CY=crossY+oy, LX=lx+ox, RX=rx+ox;

      function line(x1,y1,x2,y2,stroke,width){
        const l=document.createElementNS(NS,'line');
        l.setAttribute('x1',x1.toFixed(1)); l.setAttribute('y1',y1.toFixed(1));
        l.setAttribute('x2',x2.toFixed(1)); l.setAttribute('y2',y2.toFixed(1));
        l.setAttribute('stroke',stroke); l.setAttribute('stroke-width',width.toFixed(1));
        l.setAttribute('stroke-linecap','round'); s.appendChild(l);
      }

      line(AX,AY,LBX,BY,inkColor,sw);
      line(AX,AY,RBX,BY,inkColor,sw);

      const arc=document.createElementNS(NS,'path');
      arc.setAttribute('d',
        'M'+LX.toFixed(1)+' '+CY.toFixed(1)+
        ' Q'+AX.toFixed(1)+' '+(CY+dip).toFixed(1)+
        ' '+RX.toFixed(1)+' '+CY.toFixed(1));
      arc.setAttribute('stroke',smileColor);
      arc.setAttribute('stroke-width',arcSW.toFixed(1));
      arc.setAttribute('fill','none');
      arc.setAttribute('stroke-linecap','round');
      s.appendChild(arc);

      function fork(px,py,ux,uy){
        line(px,py,px-ux*tLen,py-uy*tLen,smileColor,arcSW);
        line(px,py,px+ux*tLen,py+uy*tLen,smileColor,arcSW);
      }
      fork(LX,CY,lUX,lUY);
      fork(RX,CY,rUX,rUY);

      return s;
    }

    const navSlot = document.getElementById('nav-logo-slot');
    if(navSlot){ navSlot.appendChild(makeLogo(28,'#1C1917','#E85D35')); }
  });
})();
</script>

<!-- Auth logic: Google Sign-In -> POST /admin/verify -> store session token -->
<script>
(function(){
  // Update this if the bot's Render URL ever changes.
  const API_BASE = 'https://awzsome-consumer-dev.onrender.com';
  // Replace with your real Client ID if this page is ever copied to a new project.
  const GOOGLE_CLIENT_ID = '639642249618-mq2qd62e9npk3s026rkv1kmuoft7tsg9.apps.googleusercontent.com';

  const statusEl   = document.getElementById('status');
  const signinCard = document.getElementById('signin-card');
  const dashCard   = document.getElementById('dash-card');

  function showSignedIn(email, role) {
    document.getElementById('who-email').textContent = email;
    document.getElementById('who-role').textContent = role;
    signinCard.style.display = 'none';
    dashCard.classList.add('show');
  }

  async function handleCredentialResponse(response) {
    statusEl.textContent = 'Verifying...';
    statusEl.classList.remove('err');
    try {
      const r = await fetch(API_BASE + '/admin/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential }),
      });
      const data = await r.json();
      if (!r.ok) {
        statusEl.textContent = data.error || 'Sign-in failed.';
        statusEl.classList.add('err');
        return;
      }
      localStorage.setItem('awzsome_admin_token', data.token);
      statusEl.textContent = '';
      showSignedIn(data.email, data.role);
    } catch (e) {
      statusEl.textContent = 'Could not reach the server. Please try again.';
      statusEl.classList.add('err');
    }
  }
  window.handleCredentialResponse = handleCredentialResponse;

  // If a session token is already stored, confirm it is still valid before
  // asking the person to sign in again.
  async function tryExistingSession() {
    const token = localStorage.getItem('awzsome_admin_token');
    if (!token) return false;
    try {
      const r = await fetch(API_BASE + '/admin/whoami', {
        headers: { Authorization: 'Bearer ' + token },
      });
      if (!r.ok) { localStorage.removeItem('awzsome_admin_token'); return false; }
      const data = await r.json();
      showSignedIn(data.email, data.role);
      return true;
    } catch {
      return false; // network hiccup — fall through to showing sign-in
    }
  }

  document.getElementById('signout-link').addEventListener('click', function(e){
    e.preventDefault();
    localStorage.removeItem('awzsome_admin_token');
    dashCard.classList.remove('show');
    signinCard.style.display = '';
  });

  window.addEventListener('load', async function(){
    const alreadyIn = await tryExistingSession();
    if (alreadyIn) return;

    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse,
    });
    google.accounts.id.renderButton(
      document.getElementById('gbtn-slot'),
      { theme: 'outline', size: 'large', shape: 'pill' }
    );
  });
})();
</script>
</body>
</html>
