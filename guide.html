<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>How Awzsome works</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

<meta property="og:title" content="How Awzsome works" />
<meta property="og:description" content="Verified deals from local businesses, right inside WhatsApp. Watch the walkthrough." />
<meta property="og:type" content="website" />

<style>
  :root {
    /* Awzsome brand — cream + coral */
    --cream-1:#FFF7ED; --cream-2:#FAF6EF; --ink:#1C1917; --coral:#E85D35; --muted:#78716C; --line:#EFE6DA;
    /* iOS WhatsApp light theme */
    --nav:#f6f6f6; --nav-accent:#0a7d68;
    --wa-chat:#e6ddd4; --wa-in:#ffffff; --wa-out:#dcf8c6; --wa-ink:#111b21; --wa-sub:#8a9aa3; --wa-tick:#34b7f1;
    --sys:'Plus Jakarta Sans',-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
    --wasys:-apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:var(--sys); color:var(--ink);
    background:radial-gradient(1100px 640px at 50% -8%, var(--cream-1), var(--cream-2) 72%);
    min-height:100%;
  }

  /* ---- Site header banner (mirrors awzsome.com nav) ---- */
  .nav { position:sticky; top:0; z-index:100; background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line); height:64px; display:flex; align-items:center;
    padding:0 max(5vw,24px); gap:2rem; }
  .nav-logo { text-decoration:none; flex-shrink:0; display:flex; align-items:center; line-height:1; }
  #nav-logo-slot { display:flex; align-items:center; overflow:visible; }
  #nav-logo-slot svg { height:28px; width:auto; display:block; }
  .nav-links { display:flex; align-items:center; gap:1.75rem; }
  .nav-links a { font-size:1rem; font-weight:500; color:var(--ink2); text-decoration:none; transition:color .15s; white-space:nowrap; }
  .nav-links a:hover { color:var(--coral); }
  .nav-cta { margin-left:auto; flex-shrink:0; background:var(--coral); color:#fff; padding:.5rem 1.25rem;
    border-radius:12px; font-size:1rem; font-weight:600; display:flex; align-items:center; gap:.4rem;
    text-decoration:none; transition:background .15s; }
  .nav-cta:hover { background:#C4421C; }
  .nav-cta svg { width:16px; height:16px; fill:currentColor; }
  @media (max-width:640px){
    .nav { height:auto; flex-wrap:wrap; gap:.75rem 1.25rem; padding:9px max(4vw,14px); }
    .nav-links { order:3; width:100%; justify-content:center; gap:1.25rem; }
    .nav-links a { font-size:.9rem; }
    .nav-cta { padding:.4rem 1rem; font-size:.9rem; }
  }

  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 32px; display:flex; flex-direction:column; align-items:center; gap:18px; }
  .segmented { display:inline-flex; background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px; gap:4px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .seg { border:0; background:transparent; font:inherit; font-weight:600; font-size:14px; color:var(--muted); padding:9px 20px; border-radius:999px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .seg.active { background:var(--coral); color:#fff; }
  .seg:focus-visible { outline:2px solid var(--coral); outline-offset:2px; }
  .kicker { font-size:13px; color:var(--muted); font-weight:600; }

  /* ---------- iPhone (true proportions, locked aspect ratio) ---------- */
  .iphone {
    aspect-ratio:390 / 844;                 /* real iPhone ratio — never stretches wide */
    height:min(806px, 82vh); width:auto;
    background:#0b0b0d; border-radius:54px; padding:12px; position:relative;
    box-shadow:0 26px 70px rgba(28,25,23,.28), inset 0 0 0 2px #23262e, inset 0 0 0 6px #000;
  }
  .iphone::before { content:""; position:absolute; left:-3px; top:148px; width:3px; height:60px; background:#20222a; border-radius:3px 0 0 3px; box-shadow:0 88px 0 #20222a; }
  .iphone::after  { content:""; position:absolute; right:-3px; top:188px; width:3px; height:92px; background:#20222a; border-radius:0 3px 3px 0; }

  .screen { width:100%; height:100%; border-radius:43px; overflow:hidden; background:var(--wa-chat); display:flex; flex-direction:column; position:relative; font-family:var(--font); font-weight:400; }

  .statusbar { position:relative; height:42px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; background:var(--nav); color:#000; font-size:14px; font-weight:600; z-index:6; }
  .statusbar .right { display:flex; align-items:center; gap:6px; }
  .statusbar .bars { display:inline-flex; align-items:flex-end; gap:2px; height:11px; }
  .statusbar .bars i { width:3px; background:#000; border-radius:1px; }
  .statusbar .bars i:nth-child(1){height:4px}.statusbar .bars i:nth-child(2){height:6px}.statusbar .bars i:nth-child(3){height:8px}.statusbar .bars i:nth-child(4){height:11px}
  .statusbar .batt { width:24px; height:12px; border:1.5px solid #000; border-radius:3px; position:relative; padding:1.5px; }
  .statusbar .batt::after { content:""; position:absolute; right:-3px; top:3px; width:2px; height:5px; background:#000; border-radius:0 1px 1px 0; }
  .statusbar .batt i { display:block; height:100%; width:78%; background:#000; border-radius:1px; }

  .island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:112px; height:31px; background:#000; border-radius:20px; z-index:8; }

  .wa-nav { background:var(--nav); display:flex; align-items:center; padding:5px 14px 8px; border-bottom:1px solid #e2e2e2; }
  .wa-nav .dp { width:36px; height:36px; border-radius:50%; object-fit:cover; margin:0 10px 0 0; flex:none; }
  .wa-nav .who { display:flex; flex-direction:column; justify-content:center; line-height:1.2; color:#111; }
  .wa-nav .who .t { font-weight:500; font-size:15px; }
  .wa-nav .who .s { font-size:11.5px; color:#8a9aa3; }

  .chat { flex:1; overflow-y:auto; padding:14px 12px 8px;
    background-image:radial-gradient(rgba(0,0,0,.03) 1px,transparent 1px),radial-gradient(rgba(0,0,0,.03) 1px,transparent 1px);
    background-size:22px 22px,22px 22px; background-position:0 0,11px 11px; scroll-behavior:smooth; }
  .chat::-webkit-scrollbar{ width:0; }

  .row { display:flex; margin:5px 2px; } .row.in{justify-content:flex-start} .row.out{justify-content:flex-end}
  .bubble { max-width:82%; padding:7px 10px 6px; border-radius:16px; font-size:12.5px; font-weight:400; line-height:1.45; color:var(--wa-ink);
    white-space:pre-wrap; word-wrap:break-word; box-shadow:0 1px .8px rgba(0,0,0,.12); position:relative; animation:pop .3s ease-out; }
  .in .bubble{ background:var(--wa-in); border-bottom-left-radius:4px; }
  .out .bubble{ background:var(--wa-out); border-bottom-right-radius:4px; }
  .meta { display:block; text-align:right; font-size:10.5px; color:var(--wa-sub); margin-top:3px; }
  .meta .tick { color:var(--wa-tick); letter-spacing:-2px; margin-left:3px; }
  .cmd { display:inline-block; } .cmd b { color:#0a7d68; font-weight:500; }
  b.hl { background:linear-gradient(transparent 55%, #ffd7a6 55%); border-radius:2px; }

  .btns { margin:3px 2px 8px; display:flex; flex-direction:column; gap:6px; max-width:82%; }
  .wbtn { background:var(--wa-in); color:#00a5f4; font-weight:500; font-size:14px; padding:11px; border-radius:14px; box-shadow:0 1px .8px rgba(0,0,0,.12); display:flex; align-items:center; justify-content:center; gap:7px; animation:pop .3s ease-out; }
  .wbtn svg { width:15px; height:15px; fill:#00a5f4; flex:none; }
  .wbtn.tapped { background:#eaf6fd; transition:.14s; }

  .dots { display:inline-flex; gap:4px; padding:10px 12px; }
  .dots i { width:7px; height:7px; border-radius:50%; background:#9aa6ad; animation:blink 1.3s infinite; }
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}

  .locpill { background:var(--wa-out); border-radius:16px; padding:8px 10px; font-size:13px; color:var(--wa-ink); display:inline-flex; gap:8px; align-items:center; box-shadow:0 1px .8px rgba(0,0,0,.12); animation:pop .3s ease-out; }
  .locpill .mini { width:74px; height:46px; border-radius:8px; background:linear-gradient(135deg,#cfe8d6,#a8d5b5 60%,#e9d7a8); position:relative; overflow:hidden; }
  .locpill .mini::after { content:"📍"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:17px; }

  .inputbar { background:var(--nav); padding:7px 10px 9px; display:flex; align-items:center; gap:9px; }
  .field { flex:1; background:#fff; border:1px solid #dcdcdc; border-radius:20px; padding:8px 12px; min-height:36px; font-size:14px; color:var(--wa-ink); display:flex; align-items:center; }
  .field .ph { color:#9aa6ad; }
  .caret { display:inline-block; width:1.6px; height:16px; background:#0a7d68; margin-left:1px; animation:caret 1s steps(1) infinite; vertical-align:middle; }
  .inputbar .send { width:38px; height:38px; flex:none; border-radius:50%; background:var(--nav-accent); display:flex; align-items:center; justify-content:center; }
  .inputbar .send svg { width:19px; height:19px; fill:#fff; margin-left:1px; }

  .home { position:absolute; bottom:7px; left:50%; transform:translateX(-50%); width:130px; height:5px; border-radius:3px; background:rgba(0,0,0,.35); z-index:7; }

  .caption { min-height:26px; font-size:16px; font-weight:700; text-align:center; color:var(--ink); transition:opacity .3s; }
  .caption .accent { color:var(--coral); }
  .controls { display:flex; align-items:center; gap:14px; }
  .bar { width:230px; height:4px; border-radius:3px; background:#ecdfce; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--coral); }
  .replay { border:1px solid var(--line); background:#fff; color:var(--ink); font:inherit; font-weight:700; font-size:13px; padding:8px 16px; border-radius:20px; cursor:pointer; }
  .replay:hover { background:#fff7ef; }
  .replay:focus-visible { outline:2px solid var(--coral); outline-offset:2px; }

  .endcard { position:absolute; inset:0; background:var(--cream-1); color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:30px; opacity:0; pointer-events:none; transition:opacity .6s; z-index:9; }
  .endcard.show { opacity:1; }
  .endcard img.appicon { width:64px; height:64px; border-radius:16px; }
  .endcard #endlogo svg { height:34px; width:auto; }
  .endcard .sub { font-size:14px; color:var(--muted); max-width:260px; line-height:1.55; }

  @keyframes pop { from{ transform:translateY(6px) scale(.98); opacity:0; } to{ transform:none; opacity:1; } }
  @keyframes blink { 0%,60%,100%{opacity:.3} 30%{opacity:1} }
  @keyframes caret { 50%{opacity:0} }
  @media (prefers-reduced-motion: reduce){ .bubble,.wbtn,.locpill{animation:none} .chat{scroll-behavior:auto} .caret{animation:none} }
</style>
</head>

  <div class="segmented" role="tablist" aria-label="Choose walkthrough">
    <button class="seg active" data-mode="consumer">For customers</button>

</main>

  const txt=document.createElementNS(NS,'text');
  txt.setAttribute('x',ox.toFixed(1)); txt.setAttribute('y',bl.toFixed(1));
  txt.setAttribute('font-size',fontSize); txt.setAttribute('font-weight','800');
  txt.setAttribute('font-family',"'Plus Jakarta Sans', sans-serif"); txt.setAttribute('letter-spacing','-0.01em');
  const spA=document.createElementNS(NS,'tspan'); spA.setAttribute('fill','transparent'); spA.textContent='A';
  const spW=document.createElementNS(NS,'tspan'); spW.setAttribute('fill',inkColor); spW.setAttribute('dx',(fontSize*0.02).toFixed(1)); spW.textContent='wzsome';
  txt.appendChild(spA); txt.appendChild(spW); s.appendChild(txt);
  const AX=apexX+ox,AY=apexY+oy,LBX=lBotX+ox,RBX=rBotX+ox,BY=baseY+oy,CY=crossY+oy,LX=lx+ox,RX=rx+ox;
  function line(x1,y1,x2,y2,stroke,width){ const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',x1.toFixed(1)); l.setAttribute('y1',y1.toFixed(1)); l.setAttribute('x2',x2.toFixed(1)); l.setAttribute('y2',y2.toFixed(1));
    l.setAttribute('stroke',stroke); l.setAttribute('stroke-width',width.toFixed(1)); l.setAttribute('stroke-linecap','round'); s.appendChild(l); }
  line(AX,AY,LBX,BY,inkColor,sw); line(AX,AY,RBX,BY,inkColor,sw);
  const arc=document.createElementNS(NS,'path');
  arc.setAttribute('d','M'+LX.toFixed(1)+' '+CY.toFixed(1)+' Q'+AX.toFixed(1)+' '+(CY+dip).toFixed(1)+' '+RX.toFixed(1)+' '+CY.toFixed(1));
  arc.setAttribute('stroke',smileColor); arc.setAttribute('stroke-width',arcSW.toFixed(1)); arc.setAttribute('fill','none'); arc.setAttribute('stroke-linecap','round'); s.appendChild(arc);
  function fork(px,py,ux,uy){ line(px,py,px-ux*tLen,py-uy*tLen,smileColor,arcSW); line(px,py,px+ux*tLen,py+uy*tLen,smileColor,arcSW); }
  fork(LX,CY,lUX,lUY); fork(RX,CY,rUX,rUY);
  return s;
}

/* ---- walkthrough ---- */
(function () {
  const chat=document.getElementById('chat'), field=document.getElementById('field');
  const captionEl=document.getElementById('caption'), statusEl=document.getElementById('status');
  const endcard=document.getElementById('endcard'), prog=document.getElementById('prog'), replay=document.getElementById('replay');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const now=()=>{ const d=new Date(); let h=d.getHours(),m=d.getMinutes(); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; };
  const SPEED=1.8;   // >1 = slower playback (applies to typing + every pause). Tune this one number.
  let runToken=0;    // bumped on every (re)play; stale timelines abort at their next pause
  const sleep=ms=>new Promise((res,rej)=>{ const t=runToken; setTimeout(()=> t===runToken?res():rej('abort'), reduce?Math.min(ms,300):ms*SPEED); });
  const scroll=()=>{ chat.scrollTop=chat.scrollHeight; };

  const pizzaCard=
`🍕 Below are the pizza deals in Manteca, CA:

(209) 555-0142 · Ends Aug 8

Tap below to claim a deal, or reply with its number (e.g. 1).
Reply MORE for other deals nearby.

  const reserveSummary=
`Please check:

Tony's Pizzeria — 312 Daniels St, Manteca, CA
Large take-and-bake pizza for $12

Name: John
How many: 2
When: today 6pm

You pay at the store — Awzsome doesn't take payment.

Shall I send this to the business? Reply YES to confirm, or NO to cancel.`;

  const reserved=
`Reserved ✅

Tony's Pizzeria
Large take-and-bake pizza for $12
Name: John · 2 · today 6pm
Code: AWZM-TONY-8F3K

Pay at the store. Please mention Awzsome when you arrive.
The business has been notified — it's worth calling ahead too if you're on a tight schedule.`;

  const salonCard=
`💇 Below are the salon deals in Manteca, CA:

1. Riverbank Hair Studio — 88 Yosemite Ave, Manteca, CA
25% off a wash, cut & style for new clients
(209) 555-0119 · Ends Aug 8

Tap below to claim a deal, or reply with its number (e.g. 1).
Reply MORE for other deals nearby.`;

  const helpText=
`Awzsome — verified deals from local businesses, on WhatsApp.

Just tell me what you're after:
"pizza deals" · "salon offers" · "coffee near me"
"gym deals" · "car wash" · "grocery offers"

When I show deals you can:

📺 Watch how Awzsome works:
awzsome.com/guide`;

  // ── vendor side ──
  const vendorIntro=
`Happy to list your deal — it is free.

First, please message from the number on your Google Business listing — that is how we confirm the deal is really from your business.`;

  const askOffer=
`Great. Send your offer in one line — what it is and the price.

For example: Large take-and-bake pizza $12 (was $18).`;

  const confirmCard=
`Please check your deal:

Business: Tony's Pizzeria
Category: Restaurant
Location: 312 Daniels St, Manteca, CA
Phone: (209) 555-0142

Offer: Large take-and-bake pizza for $12
  Price: $12 (was $18)
  Code: AWZM-TONY-8F3K

Deals on Awzsome run for up to 2 weeks from listing. This runs through Aug 8 unless marked to end early, then comes off automatically.
Approving confirms you accept that.

Listing in Manteca is free.`;

  const submittedMsg=
`Thank you — your deal has been submitted for review.

Once approved it will show to customers within 1 hour and run for up to 2 weeks. We will message you if there is any issue.

Your deal code is AWZM-TONY-8F3K

Customers show this at your counter. You do not need to record anything — just apply the discount.

Reply STATS any time to see your numbers, or REVOKE to pull a deal early. Listing in Manteca is free.`;

  const reserveNote=
`New Awzsome reservation

Large take-and-bake pizza for $12
Name: John
How many: 2
When: today 6pm
Code: AWZM-TONY-8F3K

Customer pays you directly at the store.`;

  function setCaption(html){ captionEl.style.opacity=0; setTimeout(()=>{ captionEl.innerHTML=html; captionEl.style.opacity=1; },200); }
  function bubble(side,text){ const row=document.createElement('div'); row.className='row '+side;
    const b=document.createElement('div'); b.className='bubble'; b.textContent=text;
    const meta=document.createElement('span'); meta.className='meta'; meta.innerHTML=now()+(side==='out'?' <span class="tick">✓✓</span>':'');
    b.appendChild(meta); row.appendChild(b); chat.appendChild(row); scroll(); return b; }
  function helpBubble(text){ const row=document.createElement('div'); row.className='row in';
    const b=document.createElement('div'); b.className='bubble';
    text.split('\n').forEach(ln=>{ const span=document.createElement('span');
      if(ln.startsWith('§')){ span.className='cmd'; const t=ln.slice(1); const d=t.indexOf('—'); span.innerHTML='<b>'+t.slice(0,d).trim()+'</b> '+t.slice(d); }
      else span.textContent=ln; b.appendChild(span); b.appendChild(document.createTextNode('\n')); });
    const meta=document.createElement('span'); meta.className='meta'; meta.textContent=now(); b.appendChild(meta);
    row.appendChild(b); chat.appendChild(row); scroll(); return b; }
  const LIST_ICON='<svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>';
  function buttons(labels){ const wrap=document.createElement('div'); wrap.className='btns';
    labels.forEach(l=>{ const el=document.createElement('div'); el.className='wbtn';
      // "Claim a deal" opens a list of deals -> WhatsApp list button (☰ + label).
      // Other actions are quick-reply buttons -> centered label, no icon.
      if(/claim/i.test(l)) el.innerHTML = LIST_ICON + '<span>'+l+'</span>';
      else el.textContent = l;
      wrap.appendChild(el); });
    chat.appendChild(wrap); scroll(); return wrap; }
  function locationPill(){ const row=document.createElement('div'); row.className='row out';
    const p=document.createElement('div'); p.className='locpill';
    p.innerHTML='<span class="mini"></span><span>My live location<br><span style="color:var(--wa-sub);font-size:11px">Manteca, CA</span></span>';
    const meta=document.createElement('span'); meta.className='meta'; meta.innerHTML=now()+' <span class="tick">✓✓</span>';
    p.appendChild(meta); row.appendChild(p); chat.appendChild(row); scroll(); }
  async function typingDots(ms){ const row=document.createElement('div'); row.className='row in';
    const b=document.createElement('div'); b.className='bubble'; b.style.padding='2px 4px'; b.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
    row.appendChild(b); chat.appendChild(row); scroll(); statusEl.textContent='typing…'; await sleep(ms); row.remove(); statusEl.textContent='online'; }
  async function typeInto(str){ field.innerHTML=''; const txt=document.createElement('span'); const caret=document.createElement('span'); caret.className='caret';
    field.appendChild(txt); field.appendChild(caret);
    for(let i=0;i<str.length;i++){ txt.textContent+=str[i]; await sleep(reduce?0:95+Math.random()*55); }
    await sleep(400); field.innerHTML='<span class="ph">Message</span>'; }

  // one user turn: type -> send -> bot types -> bot replies (+optional buttons)
  async function turn(userText, botText, opts={}){
    await typeInto(userText); bubble('out', userText); await sleep(500);
    await typingDots(opts.think||1100);
    if (opts.caption) setCaption(opts.caption);
    const b=bubble('in', botText); if(opts.buttons) buttons(opts.buttons);
    await sleep(opts.hold||1600); return b;
  }

  async function runConsumer(){
    // ── one complete request, end to end (find → claim → reserve) ──
    setCaption('Just message <span class="accent">Awzsome</span> to get started');
    await typeInto('Hi'); bubble('out','Hi'); await sleep(600);
    await typingDots(1200);
    bubble('in', "👋 Welcome to Awzsome — verified deals from businesses near you.\nShare your location so I can show what's live in your city."); await sleep(1700);

    setCaption('Share your location once'); locationPill(); await sleep(1000);
    await typingDots(1000); bubble('in','Got your location! What can I help you find today?'); await sleep(1500);

    setCaption('Type what you want — like <span class="accent">"pizza deals"</span>');
    await turn('pizza deals', pizzaCard, { think:1300, caption:'Real deals from real local businesses', buttons:['Claim a deal'], hold:2800 });

    setCaption('Tap <span class="accent">Claim</span> for a code to show at the counter');
    chat.querySelectorAll('.wbtn')[0].classList.add('tapped'); await sleep(800);
    await turn('Claim a deal', "Here's your code 🎟️\n\nAWZM-TONY-8F3K\n\nShow it at the counter at Tony's Pizzeria — mention Awzsome!", { think:1100, buttons:['Reserve it so they expect you'], hold:2600 });

    setCaption('Or <span class="accent">Reserve</span> it so the business expects you');
    chat.querySelectorAll('.wbtn')[1].classList.add('tapped'); await sleep(800);
    await turn('Reserve it', "Let's reserve this for you.\n\nLarge take-and-bake pizza for $12\n\nWhat name should I put it under?", { think:1000, hold:1500 });
    await turn('John', 'Thanks John. How many would you like to reserve?', { think:900, hold:1400 });
    await turn('2', 'When will you come in? (e.g. "today 7pm", "tomorrow lunch")', { think:900, hold:1400 });
    await turn('today 6pm', reserveSummary, { think:1100, hold:2600 });
    setCaption('Confirm — and you\u2019re booked');
    await turn('YES', reserved, { think:1200, hold:3000 });

    setCaption('Works for services too — <span class="accent">"salon offers"</span>');
    await turn('salon offers', salonCard, { think:1200, buttons:['Claim a deal'], hold:2600 });

    setCaption('Type <span class="accent">HELP</span> to see everything you can do');
    await typeInto('HELP'); bubble('out','HELP'); await sleep(500);
    await typingDots(1200); const hb=helpBubble(helpText); await sleep(1000);
    setCaption('Every command, in one place');
    const cmds=hb.querySelectorAll('.cmd');
    for(const c of cmds){ c.querySelector('b').classList.add('hl'); c.scrollIntoView({block:'nearest'}); await sleep(reduce?150:600); c.querySelector('b').classList.remove('hl'); }
    await sleep(1100);

    setCaption('Find it. Claim it. Reserve it. All on WhatsApp.');
    endcard.classList.add('show'); await sleep(3600);

  async function runVendor(){
    setCaption('Own a local business? List your deals <span class="accent">free</span> on WhatsApp'); await sleep(1600);

    setCaption('Just message Awzsome and say you want to list a deal');
    await typeInto('I have a store and want to list a deal or offer');
    bubble('out', 'I have a store and want to list a deal or offer'); await sleep(600);

    setCaption('First reply: submit from your <span class="accent">Google Business</span> number');
    await typingDots(1300); bubble('in', vendorIntro); await sleep(3800);

    setCaption('Then just describe your offer — no forms, no dates');
    await typingDots(1200); bubble('in', askOffer); await sleep(2800);

    await typeInto("Tony's Pizzeria — large take-and-bake pizza $12, was $18");
    bubble('out', "Tony's Pizzeria — large take-and-bake pizza $12, was $18"); await sleep(600);

    setCaption('Awzsome reads your offer back to check');

    setCaption('A 2-week window is set automatically — you never enter dates'); await sleep(2600);

    setCaption('Tap <span class="accent">Approve</span> to submit');
    chat.querySelectorAll('.wbtn')[0].classList.add('tapped'); await sleep(900);
    bubble('out','Approve'); await sleep(500);
    await typingDots(1300); bubble('in', submittedMsg); await sleep(4400);

    setCaption('A quick review — then it\u2019s live within the hour'); await sleep(2600);

    setCaption('When a customer reserves, you\u2019re notified');
    await typingDots(1300); bubble('in', reserveNote); await sleep(3800);

    setCaption('List free. Get discovered. Fill your tables.');

  // ── player + tabs ──
  let raf,start,RUN_MS=300000,activeMode='consumer';
  function tick(t){ if(!start)start=t; const p=Math.min(1,(t-start)/RUN_MS); prog.style.width=(p*100)+'%'; if(p<1) raf=requestAnimationFrame(tick); }
  const segs=Array.prototype.slice.call(document.querySelectorAll('.seg'));
  function setActiveTab(mode){ segs.forEach(function(b){ b.classList.toggle('active', b.dataset.mode===mode); }); }

  async function play(mode){
    activeMode=mode;
    runToken++; const myToken=runToken;         // aborts any running timeline at its next pause
    setActiveTab(mode);
    chat.innerHTML=''; endcard.classList.remove('show'); prog.style.width='0';
    field.innerHTML='<span class="ph">Message</span>'; statusEl.textContent='online';
    cancelAnimationFrame(raf); start=0;
    RUN_MS = (mode==='business' ? 93000 : 82000) * SPEED;
    if(!reduce) raf=requestAnimationFrame(tick);
    try { if(mode==='business') await runVendor(); else await runConsumer(); }
    catch(e){ if(e!=='abort') console.error(e); return; }
    if(myToken!==runToken) return;
    prog.style.width='100%';
    try { await sleep(1600); } catch(e){ return; }
    if(myToken===runToken) play(mode);
  }

  segs.forEach(function(b){ b.addEventListener('click', function(){
    const m=b.dataset.mode;
    history.replaceState(null,'', m==='business' ? '#business' : location.pathname);
    play(m);
  }); });
  replay.addEventListener('click', function(){ play(activeMode); });

  const startMode = (location.hash||'').toLowerCase().indexOf('business')>=0 ? 'business' : 'consumer';
  play(startMode);
})();
